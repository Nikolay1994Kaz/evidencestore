; PgBouncer стенда: режим пула — из окружения (POOL_MODE), база — основная
; через HAProxy. Параметры входа, которых PgBouncer не знает, он отвергает:
; ignore_startup_parameters — то, что шлёт esmcp (см. README).
[databases]
shop = host=haproxy port=5000 dbname=shop
[pgbouncer]
listen_addr = *
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = POOL_MODE
default_pool_size = 2
max_client_conn = 100
server_login_retry = 1
admin_users = postgres
