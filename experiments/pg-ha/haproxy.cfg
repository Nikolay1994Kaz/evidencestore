# «Адрес текущей основной базы»: HAProxy спрашивает у Patroni каждого узла,
# основной ли он (GET /primary → 200), и ведёт порт 5000 только к основному.
# Так делают в установках с Patroni; вместо него бывает VIP или запись в DNS.
global
    maxconn 200
    log stdout format raw local0
    # Сокет статистики — посмотреть живые сессии («show sess all»): им найдены
    # соединения, которые HAProxy оставляет без ответа в миг переключения (README).
    stats socket /tmp/haproxy.sock mode 666 level admin
defaults
    mode tcp
    log global
    option tcplog
    timeout connect 3s
    timeout client 1h
    timeout server 1h
    timeout check 2s
listen primary
    bind *:5000
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 1s fall 2 rise 1 on-marked-down shutdown-sessions
    server pg1 pg1:5432 check port 8008
    server pg2 pg2:5432 check port 8008
