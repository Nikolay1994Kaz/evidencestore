# Гейт — на каждый пуш и PR. На тег v* — ещё и релиз: бинарники, SHA256SUMS,
# подтверждение происхождения (проверяется `gh attestation verify`) и
# страница релиза с заметками из docs/releases/<тег>.md. Сторонние действия
# закреплены по коммиту: метку версии можно передвинуть, коммит — нет.
name: ci

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build ./... && go vet ./... && go test -race ./...

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: scripts/release.sh dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/evidencestore-*
            dist/escollect-*
            dist/esverify-*
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag
          --title "evidencestore $TAG" --notes-file "docs/releases/$TAG.md"
